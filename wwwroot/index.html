<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Sinh Viên - ASP.NET Core & SQL Server</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="brand-title">
          <h1>Hệ Thống Quản Lý Sinh Viên</h1>
          <p>ASP.NET Core 10 Web API + Entity Framework Core (SQL Server)</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="/swagger" target="_blank" class="btn btn-secondary">
          <i class="fa-solid fa-code"></i> OpenAPI / Swagger
        </a>
      </div>
    </header>

    <!-- Stats Dashboard -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon blue">
          <i class="fa-solid fa-users"></i>
        </div>
        <div class="stat-info">
          <h3 id="statTotalStudents">0</h3>
          <p>Tổng số sinh viên</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <div class="stat-info">
          <h3 id="statAvgGrade">0.0</h3>
          <p>Điểm TB toàn trường</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon amber">
          <i class="fa-solid fa-award"></i>
        </div>
        <div class="stat-info">
          <h3 id="statGoodStudents">0</h3>
          <p>Sinh viên Khá - Giỏi</p>
        </div>
      </div>
    </div>

    <!-- Main Content Layout -->
    <div class="main-layout">
      <!-- Left Column: Add/Edit Form -->
      <div class="card">
        <div class="card-header">
          <div class="card-title" id="formTitle">
            <i class="fa-solid fa-user-plus"></i> Thêm Sinh Viên Mới
          </div>
          <button type="button" id="btnCancelEdit" class="btn btn-secondary btn-sm" style="display: none;" onclick="resetForm()">
            Hủy sửa
          </button>
        </div>
        
        <form id="studentForm" onsubmit="handleFormSubmit(event)">
          <input type="hidden" id="studentId" value="0">
          
          <div class="form-group">
            <label for="studentCode">Mã Sinh Viên (*)</label>
            <input type="text" id="studentCode" class="form-control" placeholder="Ví dụ: SV006" required>
          </div>
          
          <div class="form-group">
            <label for="fullName">Họ và Tên (*)</label>
            <input type="text" id="fullName" class="form-control" placeholder="Ví dụ: Nguyễn Văn Nam" required>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="dateOfBirth">Ngày Sinh</label>
              <input type="date" id="dateOfBirth" class="form-control" required>
            </div>
            <div class="form-group">
              <label for="className">Lớp Học</label>
              <input type="text" id="className" class="form-control" placeholder="Ví dụ: CNTT-K15A" required>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="gpa">Điểm Trung Bình (0 - 10)</label>
              <input type="number" step="0.1" min="0" max="10" id="gpa" class="form-control" placeholder="8.5" required>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" class="form-control" placeholder="nam.nguyen@example.com">
            </div>
          </div>
          
          <button type="submit" id="btnSubmit" class="btn btn-primary btn-block">
            <i class="fa-solid fa-floppy-disk"></i> Lưu Sinh Viên
          </button>
        </form>
      </div>

      <!-- Right Column: Student List & Search -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <i class="fa-solid fa-list-check"></i> Danh Sách Sinh Viên
          </div>
          <button class="btn btn-secondary btn-sm" onclick="loadStudents()">
            <i class="fa-solid fa-rotate"></i> Tải lại
          </button>
        </div>

        <div class="filter-bar">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo tên, Mã SV, email..." oninput="handleSearch()">
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Mã SV</th>
                <th>Họ tên</th>
                <th>Lớp</th>
                <th>Điểm TB</th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <tr>
                <td colspan="6" style="text-align: center; color: var(--text-muted);">Đang tải dữ liệu...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/app.js"></script>
</body>
</html>
